server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
        routes:
          - id: auth-service
            uri: lb://AUTH-SERVICE
            predicates:
              - Path=/api/auth/**

          - id: product-service
            uri: lb://PRODUCT-SERVICE
            predicates:
              - Path=/api/products/**
          
          - id: inventory-service
            uri: lb://INVENTORY-SERVICE
            predicates:
              - Path=/api/inventory/**

          - id: order-service
            uri: lb://ORDER-SERVICE
            predicates:
              - Path=/api/orders/**

          - id: product-service
            uri: lb://PRODUCT-SERVICE
            predicates:
              - Path=/api/categories/**

          -  id: cart-service
             uri: lb://CART-SERVICE
             predicates:
               - Path=/api/cart/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}